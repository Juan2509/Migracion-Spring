spring.application.name=rangel

# HTTP Basic: configurar ambas variables; no se guardan credenciales en el repositorio.
spring.security.user.name=${SECURITY_USERNAME}
spring.security.user.password=${SECURITY_PASSWORD}
spring.h2.console.enabled=false

# PostgreSQL: definir estas variables antes de iniciar la aplicacion.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway administra el esquema; Hibernate solo comprueba el mapeo.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
